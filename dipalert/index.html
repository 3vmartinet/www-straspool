<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <script>
    // Ensure relative assets and favicons resolve properly when deployed in a subfolder (e.g. /dipaler/)
    (function () {
      var base = document.querySelector('base');
      var path = window.location.pathname;
      if (!path.endsWith('/') && !path.includes('.')) {
        window.history.replaceState(null, '', path + '/' + window.location.search + window.location.hash);
        path = path + '/';
      }
      if (!base || base.getAttribute('href') === '/' || base.getAttribute('href') === '/') {
        var dir = path.substring(0, path.lastIndexOf('/') + 1);
        if (dir && dir !== '/') {
          if (!base) {
            base = document.createElement('base');
            document.head.prepend(base);
          }
          base.setAttribute('href', dir);
        }
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Monitor target prices of stocks">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DipAlert">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <title>DipAlert</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0A0E27;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0A0E27;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(68, 138, 255, 0.15);
      border-top-color: #448AFF;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .loading-text {
      color: #F0F2FF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script src="https://www.google.com/recaptcha/api.js?render=explicit"></script>
</head>

<body>
  <div id="loading-indicator">
    <div class="loader-content">
      <div class="spinner"></div>
      <div class="loading-text">DipAlert</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
